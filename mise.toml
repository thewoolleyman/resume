# Toolchain version pins (SPECIFICATION/non-functional-requirements.md
# §"Contributor toolchain": pin tool versions so a fresh checkout reproduces
# the same checks). Node is pinned to a Vercel-supported LTS because the
# SvelteKit + Vercel-adapter production build's postbuild "analyse" step is not
# yet compatible with newer Node majors; Bun mirrors package.json engines.bun.
[tools]
node = "22.22.0"
bun = "1.3.6"
