# Pull-request landing automation per
# SPECIFICATION/non-functional-requirements.md §"Pull request landing
# automation": for eligible pull requests — non-draft, not labeled
# do-not-merge, opened by the repository owner OR by an allowlisted trusted
# automation identity — enable GitHub rebase auto-merge so a green pull
# request lands without a manual merge
# step. Uses a short-lived GitHub App installation token minted at runtime:
# GITHUB_TOKEN does not reliably have permission to enable auto-merge. The
# APP_ID and APP_PRIVATE_KEY secrets must be provisioned by the maintainer
# before this workflow is operational (see .github/README.md); until then
# the guard step emits an actionable notice instead of failing every PR.
#
# THE AUTOMATION ALLOWLIST — why TWO bot identities are on it.
#
# `thewoolleyman-factory-bot[bot]` (App 3668528) is the maintainer's single
# automation App, which this repository is migrating to. `resume-pr-bot[bot]`
# (App 4243167) is the identity still provisioned in the APP_ID /
# APP_PRIVATE_KEY secrets today. BOTH are listed deliberately so the cutover
# has no window in which auto-merge silently stops: whichever identity is
# actually authoring pull requests matches. Once the secrets are switched and
# a bump pull request is observed landing as the new App, the stale
# `resume-pr-bot[bot]` entry SHOULD be removed. Tracked as
# livespec-orchestrator-beads-fabro ledger bd-ib-l3nptz.12.
#
# Why `resume-pr-bot[bot]` was on it in the first place.
#
# `bump-plugin-pin.yml` is an UNATTENDED lane: a daily scheduled pull resolves
# the latest `livespec-overseer` release and opens a pin-bump pull request as
# the App. Without an allowlist entry that pull request is opened and then
# sits, so the pin only advances when a human merges it — which is not a pin
# that auto-follows, it is a notification with extra steps. Measured before
# this entry existed: pull requests #8 (v0.12.3) and #9 (v0.12.4) were both
# opened by the App and both merged by hand.
#
# Allowlisting an automation identity does NOT weaken the merge gate. Auto-
# merge only ever lands a pull request whose required checks are green, and
# the required `check` status runs `bun run check` — which includes
# `test:harness`, and therefore the bumper's own refusal tests. What the
# allowlist changes is who may WAIT for that gate unattended, not what the
# gate demands.
#
# Scope it to identities whose pull requests are produced by workflows in
# THIS repository. A bare `endsWith(login, '[bot]')` would also cover any
# third-party App later installed here, which is a wider grant than this
# lane needs.
name: auto-enable-merge
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, unlabeled]
permissions: {}
jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge') &&
      (
        github.event.pull_request.user.login == github.repository_owner ||
        github.event.pull_request.user.login == 'resume-pr-bot[bot]' ||
        github.event.pull_request.user.login == 'thewoolleyman-factory-bot[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check the GitHub App secrets are provisioned
        id: secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APP_ID / APP_PRIVATE_KEY secrets are not provisioned; auto-merge was NOT enabled for this PR (see .github/README.md)."
          fi
      - name: Mint a short-lived installation token
        if: steps.secrets.outputs.provisioned == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Enable rebase auto-merge
        if: steps.secrets.outputs.provisioned == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --rebase
