# Advance this project's Claude plugin marketplace pin when a sibling publishes
# a release.
#
# This project is a version-PINNED consumer: its `.claude/settings.json`
# marketplace entries name concrete release tags rather than the moving
# `release` branch ref that fleet members use. A concrete pin does not follow a
# release, so this lane is what keeps it from going stale — without it the
# pinned posture is indistinguishable from an abandoned one.
#
# Two ways in, because neither alone is sufficient:
#
#   repository_dispatch (sibling-released) — the fleet's release fan-out shape,
#     carrying source_repo + tag. Instant, but it only fires if the producing
#     repository can reach this one: adopters sit outside fleet credentials by
#     design, and the livespec App currently has no dispatch access here.
#   schedule — a daily PULL that resolves the source repository's latest release
#     itself. This is what makes the lane work TODAY, with no cross-repo
#     credential at all, because the source repository is PUBLIC and its
#     releases are readable by this repository's own GITHUB_TOKEN.
#   workflow_dispatch — either shape by hand, for verifying the lane and for
#     catching up immediately after a missed dispatch. Omit the tag to resolve
#     the latest release.
#
# THE PULL PATH IS THE PRIMARY, not the backstop. That ordering was written the
# other way round and it was wrong: measured on the v0.13.0 release, the
# producer's fan-out reported `delivered: 0, unauthorized: 3` — the livespec App
# reaches no adopter, so the dispatch hop delivers nothing at all. Every advance
# this lane made BEFORE 2026-07-26T21:30Z was hand-driven (`workflow_dispatch`,
# or a hand-sent dispatch). Treat `schedule` as the mechanism that actually
# keeps the pin fresh, bounding staleness to one day, and `repository_dispatch`
# as a latency optimization for the day the boundary is authorized.
#
# THE SCHEDULED PATH IS NOW PROVEN, not just reasoned about. On 2026-07-26 this
# lane fired on `event: schedule` with nothing triggering it and advanced the
# pin v0.12.4 -> v0.13.1 unattended. Two things learned that are easy to get
# wrong next time:
#   - GitHub's lag here is WIDE and variable: +50 and +52 min were observed
#     against a 86-124 min band measured on a sibling workflow. Do not treat any
#     figure as a floor, and wait two hours before concluding a run did not fire.
#     An earlier attempt was abandoned at +39 min, about eleven minutes short.
#   - A scheduled run carries no payload and no input, so the `releases/latest`
#     resolve below is what makes it work at all. Do not remove it.
#
# The rewrite refuses to touch a `release` ref and refuses a tag that is not a
# concrete version; both refusals are pinned by scripts/bump-plugin-pin.test.ts.
#
# The pull request is opened with a short-lived GitHub App installation token,
# the same identity auto-enable-merge.yml uses. GITHUB_TOKEN cannot be used
# here: this repository blocks Actions from creating pull requests
# ("GitHub Actions is not permitted to create or approve pull requests"), and
# that is a repository setting rather than a token scope, so no `permissions:`
# block can grant it.
#
# THE PULL REQUEST MUST ALSO LAND UNATTENDED, or this lane only notifies.
# `auto-enable-merge.yml` allowlists `resume-pr-bot[bot]` for exactly that
# reason, so the bump pull request enables rebase auto-merge on open and lands
# itself once the required `check` status is green. If that allowlist entry is
# ever removed, this lane silently degrades from "the pin advances" to "a pull
# request appears" — which is the state pull requests #8 and #9 were merged out
# of by hand.

name: bump-plugin-pin

on:
  repository_dispatch:
    types: [sibling-released]
  schedule:
    # Daily; the exact minute is arbitrary and off the hour to avoid the
    # scheduling stampede.
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      source_repo:
        description: Sibling repository whose release is being pinned
        required: false
        default: livespec-overseer
      tag:
        description: Released tag to pin; omit to resolve the latest release
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check the GitHub App secrets are provisioned
        id: secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APP_ID is not provisioned; the pin bump cannot open a pull request"
          fi

      - name: Mint a short-lived installation token
        if: steps.secrets.outputs.provisioned == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve the source repository and released tag
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          # repository_dispatch carries a payload; workflow_dispatch carries
          # inputs; a scheduled run carries neither and falls back to the
          # default source repository.
          SOURCE_REPO: >-
            ${{ github.event.client_payload.source_repo
                || inputs.source_repo
                || 'livespec-overseer' }}
          TAG: >-
            ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ]; then
            # PULL path: the source repository is public, so its latest release
            # is readable with this repository's own token and needs no
            # cross-repo credential.
            tag=$(gh api "repos/$OWNER/$SOURCE_REPO/releases/latest" \
                    --jq '.tag_name' 2>/dev/null || true)
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not determine a released tag for $SOURCE_REPO" >&2
            exit 1
          fi
          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::resolved $SOURCE_REPO release $tag"

      - name: Advance the pin
        id: bump
        run: |
          bun scripts/bump-plugin-pin.ts \
            --source-repo "${{ steps.inputs.outputs.source_repo }}" \
            --tag "${{ steps.inputs.outputs.tag }}"

      - name: Open the bump pull request
        if: >-
          steps.bump.outputs.bumped == 'true'
          && steps.secrets.outputs.provisioned == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ steps.inputs.outputs.source_repo }}
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          branch="chore/bump-${SOURCE_REPO}-pin-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .claude/settings.json
          # `chore(deps):` keeps the bump out of a release-worthy commit range,
          # matching the fleet's bump-pin convention.
          git commit -m "chore(deps): bump ${SOURCE_REPO} plugin pin to ${TAG}"
          git push origin "$branch"
          cat > /tmp/bump-body.md <<'BODY'
          Advances the marketplace pin in `.claude/settings.json` to the newly
          released tag.

          This project is a version-pinned consumer, so the pin does not follow
          a release on its own. Opened unattended by `bump-plugin-pin.yml`.

          The lane rewrites only concrete-version refs — a `release` ref is left
          alone, so a channel-following consumer is never silently converted to
          a pinned one.
          BODY
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "chore(deps): bump ${SOURCE_REPO} plugin pin to ${TAG}" \
            --body-file /tmp/bump-body.md
