# Governed resume data — the single canonical source
# (SPECIFICATION/spec.md §"Governed data source and predecessor import (phase 1)").
#
# This is a VERBATIM snapshot of the predecessor's PRODUCTION resume content,
# committed so phase-1 predecessor parity does not depend on a live external
# fetch. Everything from the `---` YAML document marker below to end-of-file is
# byte-identical to the retrieved source; its SHA-256 is pinned below and in
# SPECIFICATION/spec.md.
#
# Provenance of the snapshot:
#   source-url: https://interactive-resume-data-chad-woolley.gitlab.io/interactive-resume-data-chad-woolley.yml
#   retrieved: 2026-07-06
#   upstream-last-modified: 2022-06-27
#   sha256: 792097b01aef31fdc7cbf2c2463492e87c5ca89bc8d864ef3ebacfc7f7a4d158
#
# The on-disk shape is the predecessor's human-friendly AUTHORING shape:
# top-level `about`/`header` maps plus ordered section keys, each mapping to an
# array of item maps {name, level?, start?, end?, desc}. It is transformed into
# the derived resume data contract at load time (SPECIFICATION/contracts.md
# §"Governed data source contract"). These leading comments are provenance
# only and are NOT parsed as a top-level data group.
---
about:
  title: About This Resume/App
  content: |
    ## Cover Letter
      * Please also see my [Cover Letter](https://cover-letter.thewoolleyweb.com/).
    ## Tech Info
      * I (Chad) created this app from scratch in about a month, using Vue.js (I had not previously used Vue).
        It is a single-page browser-only app; with no server backend.
      * The actual text content is completely configurable, and loaded and parsed on the fly from a
        YAML file.

    ## Management, Build, Deploy, and Hosting
      * It fully hosted on GitLab's infrastructure, with 100% test coverage, continuous integration, build pipeline, and
        continuous deployment.
      * All features were incrementally developed and tracked with a
        [GitLab Issue Tracking Board](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/-/boards)

    ## Tech/Tools
      * Vue.js served via Nuxt, Vuex for state management, bootstrap-vue for design, fuse.js for searching,
        js-yaml for parsing the data file, marked for data file markdown parsing, Ramdajs for most data-processing
        logic, Jest/vue-jest for testing, and eslint with various Vue plugins.  It was developed in Jetbrains
        Webstorm, with a committed Webstorm IDE config which (almost) completely matches the eslint config.

    ## Source Code and Development
      * [Source Code](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io)
      * [Continuous Integration/Continuous Deployment](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/pipelines)
      * [100% test coverage](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/-/jobs)
      * [GitLab Issue Tracking Board](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/-/boards)
      * [Project Insights](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/insights) and
        [CI/CD Charts](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/pipelines/charts)

    ## Bugs/Errata
      * Firefox (Mac) has performance issues with this resume, probably garbage-collection-related,
        especially when searching.  This is possibly related to
        [this bug](https://bugzilla.mozilla.org/show_bug.cgi?id=1103593).
        Chrome and Safari seem OK.
        [Debouncing](https://gitlab.com/interactive-resume/interactive-resume.gitlab.io/issues/35) would help.)
      * iPhone native has some resizing issues when the date-sorting dropdown is used.

    ## Design Mea Culpa
      * I am not a designer!  I used bootstrap and bootstrap-vue components for design, and tried to make
        this app somewhat responsive (at least the nav), but it should be completely obvious that making things look pretty
        is not my forté. :) 💄

    ## Content Mea Culpa
      * I hadn't updated my resume in 13 years (my entire time at Pivotal), and for older jobs/skills, I just copied
        the content verbatim.  Apologies for any broken links, or outdated/naive prose or references. 😁 🙈

