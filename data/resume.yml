Skills/Tools - Source Control:
  - name: Source Control Management (SCM) tools
    level: teach
    desc: |
      I've managed and worked with many source control systems, going back to mainframe days.  I'm glad we have
      git now :).  Here's some of them:
      GitLab, Github, AWS Codecommit, Git, Subversion, SVK, CVS, ClearCase, SourceSafe, ClearQuest, ReqPro, RACF, CICS
  - name: Source Control Management Patterns
    level: teach
    desc: |
      Experienced and [opinionated](https://github.com/thewoolleyman/gitrflow/blob/master/readme/goals_and_philosophy.md)
      on tradeoffs of various SCM workflows and patterns: Monorepo vs. Multi Repo, Monoliths vs. Monorepos,
      Merge vs. Rebase workflows, Gitflow, Github Flow, etc.
      One of favorite git CLI tricks is: `git rebase -i $(git merge-base head master)`.
      **UPDATE: While studying for the GitLab technical interview, I found
      [this documentation on GitLab Flow](https://docs.gitlab.com/ee/workflow/gitlab_flow.html).
      Yes, I agree completely!  It almost exactly echoes my opinions in the link above, including my criticisms of
      the Git Flow approach, usage of rebasing for feature branches,
      and the importance of `--no-ff` when merging upstream.**

