Skills/Tools - Editors/IDEs:
  - name: Jetbrains IDEs
    level: toolbox
    desc: Jetbrains IDEs are what I use for coding - Rubymine, Webstorm, Idea, Pycharm, PHPStorm
  - name: Atom / VSCode / Textmate
    level: toolbox
    desc: |
      I use Jetbrains IDEs for coding, and only use text editors for quickly editing text files.  I am very proficient
      in them, and would consider myself a power user in terms of keybinding usage, configuration (versioned in git),
      refactoring tools, debuggers, quickly exploring git history and annotations, etc.  However, I do not use them
      for source control, other than visual diff and merge conflicts - I like my CLI for git :)
      The only other exception when I do not use them for coding is when Jetbrains does not have good enough support for
      the language (e.g. for Elm or Haskell when I last checked).  I usually use Textmate as my text editor, because
      my main criteria for a text editor is that it starts instantly, but but occasionally use vi or Atom or VSCode if
      it's handier.
